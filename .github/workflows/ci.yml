name: CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
  TERRAFORM_VERSION: "1.7.0"
  AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}

jobs:
  test:
    name: Phase 1 - Testing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Test Backend
        working-directory: ./server
        run: |
          npm ci
          npm test -- --json --outputFile=test-report.json

      - name: Test Frontend
        working-directory: ./client
        run: |
          npm ci
          npm run test -- --run --reporter=json --outputFile=test-report.json

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            server/test-report.json
            client/test-report.json


  terraform:
    name: Phase 2 - Infrastructure Provisioning
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ env.AWS_SESSION_TOKEN }}

      - name: Initialize Terraform
        working-directory: ./terraform
        run: terraform init

      - name: Validate Terraform configuration
        working-directory: ./terraform
        run: terraform validate

      - name: Terraform Plan
        working-directory: ./terraform
        run: |
          terraform plan -out=tfplan

      - name: Clean up deposed resources
        if: github.ref == 'refs/heads/main'
        working-directory: ./terraform
        run: |
          # Remove any deposed/orphaned security groups from state to avoid long destruction waits
          terraform state list | grep 'aws_security_group' | while read sg; do
            terraform state show "$sg" 2>/dev/null || terraform state rm "$sg" 2>/dev/null || true
          done
        continue-on-error: true

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main'
        working-directory: ./terraform
        run: terraform apply -auto-approve tfplan

  deploy:
    name: Phase 3 - Build and Deploy
    runs-on: ubuntu-latest
    needs: terraform
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ env.AWS_SESSION_TOKEN }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag
        id: meta
        run: |
          echo "tags=${{ steps.login-ecr.outputs.registry }}/shopsmart-final-repo:${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Build Docker image
        working-directory: ./server
        run: |
          docker build -t shopsmart-final-repo:${{ github.sha }} .

      - name: Tag and Push Docker image
        run: |
          docker tag shopsmart-final-repo:${{ github.sha }} ${{ steps.meta.outputs.tags }}
          docker push ${{ steps.meta.outputs.tags }}

      - name: Get AWS Account ID
        id: account
        run: echo "id=$(aws sts get-caller-identity --query Account --output text)" >> $GITHUB_OUTPUT

      - name: Render Amazon ECS task definition
        id: render-task
        uses: aws-actions/amazon-ecs-render-task-definition@v1.6.2
        with:
          task-definition: ecs/task-definition.json
          container-name: shopsmart-final-container
          image: ${{ steps.meta.outputs.tags }}
          environment-variables: |
            NODE_ENV=production
            PORT=5001

      - name: Add Roles to Task Definition
        run: |
          jq '. + {
            executionRoleArn: "arn:aws:iam::${{ steps.account.outputs.id }}:role/LabRole",
            taskRoleArn: "arn:aws:iam::${{ steps.account.outputs.id }}:role/LabRole"
          }' ${{ steps.render-task.outputs.task-definition }} > rendered-task-definition.json

      - name: Deploy to Amazon ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: rendered-task-definition.json
          service: shopsmart-final-service
          cluster: shopsmart-final-cluster
          wait-for-service-stability: true
